<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NCSLaboratory emergence field</title>
  <desc id="desc">Abstract visualization of nonlinear trajectories becoming a connected computational network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061325"/>
      <stop offset=".55" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="cyanFlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#59c8ff" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#7edcff"/>
      <stop offset="1" stop-color="#d8f6ff"/>
    </linearGradient>
    <linearGradient id="warmFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9d72" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#ffbd83"/>
      <stop offset="1" stop-color="#ffe2b7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".46" r=".55">
      <stop offset="0" stop-color="#388ac6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g opacity=".12" stroke="#a8d7f5" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M-50 610 C150 260 290 790 475 430 S720 155 850 410 S1035 785 1200 425 S1425 190 1660 315" stroke="url(#cyanFlow)" stroke-width="5" opacity=".8"/>
    <path d="M-40 700 C115 405 300 180 470 510 S710 790 870 490 S1065 190 1240 475 S1440 730 1650 540" stroke="url(#warmFlow)" stroke-width="4" opacity=".75"/>
    <path d="M-80 480 C120 760 315 220 500 390 S720 650 900 315 S1110 250 1280 520 S1480 600 1660 270" stroke="#6ab9e8" stroke-width="2.5" opacity=".6"/>
    <path d="M-50 330 C120 550 260 360 420 300 S650 520 820 570 S1030 320 1180 330 S1450 520 1660 430" stroke="#f4b27f" stroke-width="2" opacity=".45"/>
    <path d="M0 760 C180 500 330 520 520 680 S820 790 1010 590 S1330 280 1600 390" stroke="#a5e8ff" stroke-width="1.5" opacity=".45"/>
  </g>

  <g fill="none" stroke="#9ce7ff" stroke-width="1.5" opacity=".28">
    <path d="M980 255 L1190 380 L1370 270 L1510 470 L1290 615 L1070 560 Z"/>
    <path d="M1035 365 L1260 490 L1450 390"/>
    <path d="M1070 560 L1260 490 L1290 615"/>
  </g>

  <g filter="url(#softGlow)" fill="#d7f7ff">
    <circle cx="980" cy="255" r="6"/><circle cx="1190" cy="380" r="8"/><circle cx="1370" cy="270" r="5"/>
    <circle cx="1510" cy="470" r="7"/><circle cx="1290" cy="615" r="6"/><circle cx="1070" cy="560" r="5"/>
    <circle cx="1035" cy="365" r="4"/><circle cx="1260" cy="490" r="9"/><circle cx="1450" cy="390" r="4"/>
  </g>

  <g opacity=".7" fill="#e9f8ff" font-family="Inter, Arial, sans-serif" letter-spacing="3">
    <text x="92" y="790" font-size="15">NONLINEAR DYNAMICS</text>
    <text x="640" y="132" font-size="15">EMERGENCE</text>
    <text x="1260" y="770" font-size="15">COMPUTATION</text>
  </g>
  <g fill="#fff" font-family="Inter, Arial, sans-serif">
    <text x="92" y="846" font-size="34" font-weight="700" letter-spacing="8">NCS</text>
    <text x="215" y="846" font-size="18" opacity=".78" letter-spacing="4">NONLINEAR COMPLEX SYSTEM LABORATORY</text>
  </g>
</svg>
