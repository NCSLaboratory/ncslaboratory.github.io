  email: "pwkim@unist.ac.kr"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:pwkim@unist.ac.kr"
    - label: "Research profile"
      icon: "fas fa-fw fa-user"
      url: "https://starlibrary.org/research/researcherDetail?mngNo=1250&searchName=%EA%B9%80%ED%95%84%EC%9B%90&searchType=everything&insttType=&prevTabNm=researcherList"
    - label: "Personal homepage"
      icon: "fas fa-fw fa-globe"
      url: "https://sites.google.com/view/pilwonkim/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/unist-ncs"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/unist-ncs"

include:
  - _pages

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache
